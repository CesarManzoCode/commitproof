adrs_added:
  - "ADR-0036: K6 report — the reference run, the failover metrics, the campaign statistics and the gate's cross-check, fixed before any K6 render (contract 1.1.1)"
deviations_from_prompt:
  - "Reference run: K4 C2 seed 3 (three F1c, one failover), without an F2a. The prompt asks for a real K4 failover run with at least one F2a and one F1c; no real K4 run has both (every real K4 archive's plan listed: F1c only in D1 ×5 and C2 seed 3; F2a only in C1, C4, C5, C6, C7, D2, D2′). CONTRACT §15 K6 requires a real K4 failover, and the contract wins (AGENTS.md §1). K5's C10 runs hold F2a and F1c but are K5 runs; one was rendered in development only (ADR-0036)."
  - "K6.2's `go clean -cache -modcache` ran on the fresh clone's own GOCACHE and GOMODCACHE (inside its temporary directory), not on the owner's global Go caches: cleaning those would delete data outside the repository (AGENTS.md §3). Both caches held 0 files after the clean; the go1.26.9 toolchain and the modules were downloaded again (PREREQUISITES §5)."
  - "\"Metrics from observations\": the report renders the metrics the sealed observations hold (pooler role and reachability, WAL position, status-probe latency, CDC slot readiness, client errors). No run holds a /metrics scrape (P23), so no Prometheus metric timeline exists to render (LIM-40)."
  - "Before ADR-0036 the reference run's history and observations were inspected with ad-hoc scripts (outside evidence) to choose the reference and the window definition; ADR-0036 records the alternatives and was committed before any recorded render (NOTES §2)."
  - "cpreport also accepts a run as its §13 archive <run-id>.tar.zst, and imports the utility packages canonjson and params besides §5.3's list, as cpgate does (ADR-0036; enforced by an allow-list test with a control)."
  - "Contract raised to 1.1.1 by ADR-0036 (clarification of §5.3, §10.10, §12.3, §15 K6); cpgate K5 now pins D3′'s runs to 1.1.0 (params.K5ContractVersion), and the recorded precondition (k6-precondition) shows K1–K5 still PASS with K6's binaries."
