demonstrated:   # no claims.yaml yet (K7); each line names its artifact in evidence/K6/NOTES.md
  - "cpreport renders a static, self-contained incident report (inline CSS and SVG, a JSON data block, no executable script, no external reference) of the real K4 failover run 20261011T231036Z-C2-3-real-f4505b54 byte-identically three times (sha256 35dc3e48…c94c) and from a fresh clone of 2927f46 built with emptied Go caches (NOTES §1, §5)."
  - "K6.1 can fail: a build that iterates maps unsorted renders three different outputs (NOTES §5)."
  - "A run whose seal does not verify is refused (exit 2) and nothing is written, as a directory and as a re-archived copy (K6.4, NOTES §1)."
  - "Every one of the reference run's 7 862 history events is in exactly one element of the page; every fault phase, observed rule, leader change and checker anomaly is present, each anomaly op linked to its operation (K6.3)."
  - "Every per-fault metric of the page (§10.10 windows, longest ok gaps, non-ok counts per gateway; ok-latency n/p50/p95/p99 before, during, after; rule and leader changes) equals cpgate's independent computation from the raw history and observations (K6.5); the windows also agree with cpcheck C9's own statistics (NOTES §4.2)."
  - "What the reference report shows (observations explain, never judge): F1c on leader n1 → rule 2.0 led by n2 first observed 25.7 s after injection; F1c on n2 → no failover, 18 ok operations from 55.9 s to the end of the workload, none after 86.3 s; the four K4 anomalies at 30.7–41.6 s inside the first fault (NOTES §4.2)."
  - "A per-campaign summary page with §12.3 statistics in integer arithmetic (Wilson 95 %, zero-failure bound; N = 10 → 0.259 unit-tested), rendered for K4's 220 verified runs (NOTES §3, §7)."
  - "All CI targets including the new ci-report exit 0 locally on the clean 2927f46 (record ci, K6.6)."
