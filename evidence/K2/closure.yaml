deviations_from_prompt:
  - "cpcheck corpus accepts optional flags beyond §5.6's `cpcheck corpus <dir>`: --elle-oracle (K2.4 compares 350 histories in one oracle pass instead of 350 `check --elle-oracle` invocations), --out <dir> and --results-only (evidence output). The documented forms of §5.6 are unchanged (same treatment as K1's hidden runner subcommands)."
  - "The K1 precondition is checked on a copy of evidence/K1 (scripts/k1-precondition.sh) because cpgate writes gate.json into the directory it evaluates; an earlier unrecorded check in this session rewrote evidence/K1/gate.json and was reverted with git checkout before any commit (NOTES §6)."
  - "Observation classes (C3's -process/-realtime variants and G2-item under repeatable-read; C8's notify-window-loss) are reported under stats.observations, keeping the checks.json schema of §15 K2 exact; they never change validity."
  - "C8 checks SHOW/EXECUTE and LISTEN sessions at all times, not only after a recorded leader change: leader changes are visible only in observations, which checkers must not read; §10.9's condition is a subset."
  - "The history encodings of W5–W8 (not specified by the contract) are defined in K2 by the checkers (internal/checker/c5c7.go, c8c9.go); K5's clients must emit them (LIM-24)."
  - "elle-cli is run three times per history (validity with only the model; process-only and realtime-only class runs) and fed histories without index fields, because of elle-cli behaviour found by black-box probes (NOTES §2 K2.4)."
  - "The oracle is an image built FROM the pinned clojure image with elle-cli's jar (build/Dockerfile.elle); elle-cli is still built inside the pinned image and never vendored."
