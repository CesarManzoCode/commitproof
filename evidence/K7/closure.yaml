adrs_added:
  - "ADR-0045: K7 repeats of recorded findings stay summaries; the repeat predicates, the store step and the D3′/D5 decision (owner decisions 1–2; contract 1.8.0, before any K7 run)"
  - "ADR-0046: K7.3 — elle-cli on every C3 anomaly of K7, on M1's five D1 runs, and on histories where elle-cli runs out of memory (owner decision 4; contract 1.8.1, before any K7 run)"
  - "ADR-0047: P25 raised to 275 MB; K7 resumes from its store step, the cited D3′/D5 runs in full (owner decision on K7's first BLOCKED closure, 2026-10-16; contract 1.9.0, after the matrix)"
deviations_from_prompt:
  - "First host power-off during the matrix (2026-10-16 04:39Z): the unsealed V1 C1 seed 8 attempt archived unchanged in evidence/K7/harness-defect-runs/ and re-run with the same plan and seed; the leftover project resources removed (labelled ones only) before prereq-check passed 26/26; evidence/K1/prereq.json restored both times."
  - "Second host power-off during K7.4 (orderly shutdown, 2026-10-17 04:57:02Z): pkg-replay-FND-C8-5254b5cb interrupted after its third replay was sealed; no run directory unsealed, so nothing archived; the command is resumable (sealed replays reused, the unchecked one checked) and is to be re-executed as pkg-replay-FND-C8-5254b5cb-2. At this resume prereq-check failed R1 after removing only the labelled leftovers: K7 BLOCKED before any further cluster run (NOTES §2.1)."
  - "A dry run with the binaries of contract 1.9.0 lists the 130 matrix runs as to-run (their plans now carry 1.9.0, a different plan sha256); the matrix, complete under 1.8.1, is not re-run (prompts/K7.md: the version is not bumped while the matrix runs)."
  - "P25 is enforced at 275 MB (ADR-0047, the owner's decision of 2026-10-16 on K7's first BLOCKED closure), not the 250 MB of the 2026-10-15 decision text."
  - "Two harness defects fixed during the matrix (runner final reads, 1f1f60b; C3 cycle reporting, 32b660a); the driver was stopped with SIGTERM at a run boundary each time, binaries and the runner image rebuilt and locked, the three INVALID V1 C2 seed 3 attempts set aside as summaries, the sealed runs re-checked (not recomputed), and the campaign resumed."
  - "K7.4 executes each package's P13 replay command (commitproof replay accepts only --times 5); cpgate K7's check corrected (9807b0c), its argv matched by tokens."
  - "The docker-cleanup-resume record was first written with raw newlines in its argv; the line was rejoined with escaped newlines and record-command.sh fixed (748e549)."
  - "INVALID attempts that did not recover within P06 (four during the matrix, two during K7.4) are reported as an observation (LIM-45): §11.1 names this a LIVENESS_OBSERVATION, §12.1 makes the runs INVALID, and no K7 criterion packages INVALID runs."
  - "At the resume after the owner freed memory (NOTES §2.2), the host's linux package had been upgraded (7.2.9 → 7.2.10, 2026-10-17 18:09:26Z) while kernel 7.2.9 kept running; with its module tree gone, Docker could not create veth pairs and replay 4 of FND-C8-5254b5cb was INVALID three times (cluster up exit 2, no operation run). The three attempts were stored as summaries in package-replays/ and set aside to runs/k7-invalid/k7-pkg-FND-C8-5254b5cb/ (records setaside-c8-10-r4-*, as V1 C2 seed 3's), so that replay 4 is made afresh with the same plan after a reboot; they count toward nothing. make prereq-check does not check veth, so it passed 26/26 after the upgrade."
  - "Work in progress committed at the previous BLOCKED stop (the prompt asks to commit everything): claims.yaml and the packages' claim.yaml, the three C8 READMEs' and one triage record's corrections (checked against the sealed histories), K7.4's five completed replay commands and their summaries."
  - "Fourth resume (NOTES §2.3), after the owner rebooted into the installed kernel: kernel, veth and a bridge probe checked before any cluster run; prereq-check 26/26 and evidence/K1/prereq.json restored; cpgate K1–K6 PASS on copies; images equal the lock; seal sweep instead of relaunching the matrix (its exit 1 is V1 C2 seed 3's three harness-defect attempts under runs/k7-invalid, whose seals were never valid). pkg-replay-FND-C8-5254b5cb-3 made replays 4 and 5; the eight packages not started replayed. No new INVALID or unsealed attempt, so nothing archived under harness-defect-runs/."
  - "cpgate K7 held K7.4's replays to the matrix's contract version 1.8.1; corrected to 1.9.0 for package-replays/ only, with a regression test (9bf9005), built after the last replay so no binary changed under K7.4."
  - "K7.4 counts each package's own anomaly class: FND-C2-6806aeca's replay command summary line counts its shared minimized run's incompatible-order (5 of 5), while its package class non-linearizable is in 0 of 5; both are reported."
  - "K7.4's replays are recorded, not triaged or cross-checked with elle-cli (K7.3 and ADR-0046 cover the matrix): two replays show C3 cycle classes, listed verbatim, no finding derived (LIM-46, HYP-0001)."
  - "The first cpgate K7 run with negative controls (cpgate-k7) exited 1: the criteria passed, but the controls' harness had three defects (dangling links under a relative --evidence and K2/K3/pre-K7 not linked; K7.2's forgery left CLM-0021's hash of the forged page; K7.7 accepted only one tag check). Fixed with regression tests (9056ede); no criterion, threshold or control relaxed. gate.json and negative-controls.json of that run committed as written (f3f465c)."
  - "v1.0.0 was tagged locally on 5a69aa9 and checked (tag-check); after the gate run it was withdrawn (record tag-withdraw; never pushed), since the gate did not pass and the fixes change code. It is to be re-created on the release commit after CI runs on a commit with the fixes."
  - "While the fixed gate was being verified on a scratch copy in this session, the session stopped the run because the system was critically low on memory. /tmp is tmpfs on this host; this session's scratch copies (914 MB) and the gate's extracted runs (650 directories, about 1.3 GB) were measured and removed (this project's own temporaries only); MemAvailable then 14.1 GB (host-memory-reap). The gate group now uses TMPDIR on disk (36d25e6)."
  - "That stop ended K7 BLOCKED (closure 732e4ec). Fifth resume (NOTES §2.5): the owner freed memory and authorized restarting the gate; kernel/veth and prereq-check 26/26 re-checked, evidence/K1/prereq.json restored; MemAvailable sampled every 5 s; each heavy step started only with at least 12 GiB available and ran alone."
  - "cpgate-k7-2 was stopped with SIGTERM between two evaluations when MemAvailable fell to 3.42 GiB (cpgate about 8.6 GiB resident; the gate has no parallelism to reduce). The gate was re-run with the Go runtime's soft memory limit GOMEMLIMIT=6GiB, which changes no verdict (cpgate near 5.7 GiB, MemAvailable at least 4.90 GiB in every later run; cpgate-k7-5: at least 5 834 792 kB, 5.56 GiB). The sampler's full log is memory-resume-8-final.log."
  - "v1.0.0 tags the commit the release CI built, as the owner asked, not the final commit (the prompt says the final commit): the closure records the CI, the tag check and the gate run on the tagged code, so it cannot precede them; the commits after cb69c0b change only evidence, documents, claims.yaml and images.lock.json."
  - "A fourth harness defect surfaced when the gate ran on the documents written after cpgate-k7-3: K7.7's sabotage did not rewrite the claim hash of the tag check it forges (CLM-0071). Fixed with a regression test (cb69c0b); CI (ci-3), the tag (moved from a4352af, record tag-withdraw-2; never pushed) and the gate (cpgate-k7-5) were redone on it. No criterion, threshold or control relaxed."
  - "The gate's last run (cpgate-k7-5) ran on the final README, LIMITATIONS, NOTES and claims.yaml; its own result is reported here and in gate.json, not as a claim in the audited files, since a claim about a run cannot precede it."
