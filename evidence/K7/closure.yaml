demonstrated:   # each line backed by a claims.yaml id (claims.yaml is in progress; see not_demonstrated)
  - "K7's matrix ran complete on the real build (Multigres e3cbdbb, contract 1.8.1, with the metrics exporter): 130 valid runs, 19 FAIL, 111 PASS; all 248 run directories of runs/k7 and runs/k7-pkg pass verify-seal at this resume [CLM-0020]."
  - "No acknowledged write was lost in any valid K7 run: C1 valid in all 130 valid primaries [CLM-0025]."
  - "ADR-0045's predicates classified 14 FAIL runs as repeats of recorded findings (listed below with the fields that matched) and 5 as new failures, each minimized, replayed 5× by the driver, stored in full and packaged as a new finding [CLM-0026, CLM-0045–CLM-0049]."
  - "K7.3: every C3 anomaly of the four matrix runs and of M1's five D1 runs labelled oracle-disagreement with a triage (elle-cli out of memory, cycles through incompatible keys, or no answer for G-nonadjacent/G2-item) [CLM-0027]."
  - "Two harness defects found and fixed with regression tests (runner final reads, 1f1f60b; C3 cycle reporting, 32b660a); the C3 correction changes no verdict, C3 validity or class set in any of 172 committed runs held in full [CLM-0029, CLM-0030, CLM-0015]."
  - "P25 (ADR-0047, 275 MB): every K7 run stored once (6 in full, 206 summaries), the cited D3′/D5 real-build runs in full under evidence/K7/cited (seal roots equal to K5's) [CLM-0014, CLM-0018, CLM-0033]; count at this stop below 275 MB (NOTES §12)."
  - "Fourteen findings packages written under findings/ (not published), each README's first line stating whether an acknowledged write was lost in its original run (no, in all 14) [CLM-0040–CLM-0053]."
  - "Four matrix-time attempts and two K7.4 attempts ended INVALID because no recovery insert succeeded within P06 after the last heal; recorded as an observation (LIM-45), not packaged [CLM-0016; NOTES §8, §11]."
  - "Resume after the first power-off: prereq-check 26/26 after removing only labelled leftovers; cpgate K1–K6 PASS; images equal the lock [CLM-0031, CLM-0032]. Resume after the second power-off: cpgate K1–K6 PASS on copies; images equal the lock [CLM-0055]; prereq-check 25/26 with R1 failing [CLM-0054]. Resume after the owner freed memory: prereq-check 26/26, cpgate K1–K6 PASS on copies, images equal the lock [CLM-0056]; all 248 run directories pass verify-seal."
  - "K7.4, FND-C8-5254b5cb: the resumed replay command reused its sealed replays 1–3 and checked replay 3 (PASS) [CLM-0057]."
not_demonstrated:
  - "K7.4 for 9 of 14 packages: FND-C8-5254b5cb's replay command (pkg-replay-FND-C8-5254b5cb-2, exit 2) stopped at replay 4, INVALID three times because no cluster could start on the host (replays 1–3 sealed and checked, PASS); FND-C8-e6b7ca52, FND-C8-ff4475d8, FND-C9-40b6f05a, FND-C9-2fe9a9fc, FND-C9-90da5532, FND-D1-fb8d0f8c, FND-D1-2e860fd2, FND-D1-a8eb9857 not started. No package's finding.json has its k7_replay written yet; NOTES §8's table is not written."
  - "K7.5: claims.yaml in progress (50 claims; CLM-0019, CLM-0028 and CLM-0034, cited by NOTES/README, not yet written); every package's claim.yaml present."
  - "The final README, LIMITATIONS (LIM-45's count of INVALID attempts now 6), CHANGELOG, overclaim review and runs-index.json with K7.4's replays; the final P25 count (p25-final)."
  - "cpgate K7 with negative controls, every make ci-* target on the release commit, the tag v1.0.0 and its tag check."
  - "Whether the six attempts that did not recover within P06 reproduce: an observation only (§12.1 makes them INVALID)."
  - "Remote CI on GitHub (LIM-16)."
