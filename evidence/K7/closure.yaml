gate:
  command: "cpgate K7 --evidence evidence/K7 --negative-controls"
  record: "cpgate-k7 (on 5a69aa9; binaries of 77c5f6c, before the controls' fixes)"
  exit_code: 1
  criteria: [{K7.1: PASS}, {K7.2: PASS}, {K7.3: PASS}, {K7.4: PASS}, {K7.5: PASS}, {K7.6: PASS}, {K7.7: PASS}]
  negative_controls:   # each control's copy failed K7.1–K7.5 besides its target: harness defects (dangling relative links, K2/K3/pre-K7 not linked; K7.2's forgery left CLM-0021's hash), fixed in 9056ede; not yet re-run
    - {criterion: K7.1, failed: [K7.1, K7.2, K7.3, K7.4, K7.5], failed_only_target: false}
    - {criterion: K7.2, failed: [K7.1, K7.2, K7.3, K7.4, K7.5], failed_only_target: false}
    - {criterion: K7.3, failed: [K7.1, K7.2, K7.3, K7.4, K7.5], failed_only_target: false}
    - {criterion: K7.4, failed: [K7.1, K7.2, K7.3, K7.4, K7.5], failed_only_target: false}
    - {criterion: K7.5, failed: [K7.1, K7.2, K7.3, K7.4, K7.5], failed_only_target: false}
    - {criterion: K7.6, failed: [K7.1, K7.2, K7.3, K7.4, K7.5, K7.6], failed_only_target: false}
    - {criterion: K7.7, failed: [K7.1, K7.2, K7.3, K7.4, K7.5, K7.7], failed_only_target: false}
  note: "The gate is not passed: Gate K7 requires the negative controls to fail exactly their targets. With the fixes, a verification on a scratch copy (not recorded) had six of seven controls isolating their target and K7.2's also failing K7.5, which led to the third fix; the run after it was stopped by the session for low memory."
demonstrated:   # each line backed by a claims.yaml id
  - "K7's matrix ran complete on the real build (Multigres e3cbdbb, contract 1.8.1, with the metrics exporter): 130 valid runs, 19 FAIL, 111 PASS [CLM-0020]; all 248 run directories of runs/k7 and runs/k7-pkg pass verify-seal [CLM-0061]."
  - "No acknowledged write was lost in any valid K7 run, in any finding's original run, or in any of K7.4's replays: C1 valid, no C1 anomaly [CLM-0025, CLM-0034, CLM-0063]."
  - "ADR-0045's predicates classified 14 FAIL runs as repeats of recorded findings and 5 as new failures, each minimized, replayed 5× by the driver, stored in full and packaged as a new finding [CLM-0026, CLM-0045–CLM-0049]."
  - "K7.3: every C3 anomaly of the four matrix runs and of M1's five D1 runs labelled oracle-disagreement with a triage [CLM-0027]."
  - "Harness defects fixed with regression tests: runner final reads (1f1f60b), C3 cycle reporting (32b660a; no verdict, C3 validity or class set changed in 172 committed runs), the gate's K7.4 contract version (9bf9005), the gate's negative-control harness and K7.7's tag-check attempts (9056ede) [CLM-0029, CLM-0030, CLM-0015, CLM-0067]."
  - "K7.4 complete: every package's replay command executed once more (14 records, each exit 0, five valid replays each); per package's own class: FND-D1-fb8d0f8c 5, FND-D1-2e860fd2 4, FND-D1-a8eb9857 3, FND-C2-2a534585 4, FND-C2-6806aeca 0, FND-C2-8215101c 5, FND-C2-c7475a73 0, FND-C8-ff4475d8 0, FND-C8-e6b7ca52 0, FND-C8-5254b5cb 0, FND-C9-40b6f05a 4, FND-C9-2fe9a9fc 5, FND-C9-90da5532 1, FND-C11-17a344c1 3, each of 5; recorded classifications unchanged, the result written beside them [CLM-0062]."
  - "K7.4's 70 valid replays and 5 INVALID attempts stored as summaries and listed in runs-index.json; results.json byte-identical [CLM-0028]."
  - "Six INVALID attempts (four at matrix time, two in K7.4) did not recover within P06, each with the same state; recorded as an observation (LIM-45), not packaged [CLM-0016]."
  - "Fourteen findings packages under findings/ (not published), each with finding.json k7_replay, the README's K7 sections and claim.yaml naming its K7.4 record [CLM-0040–CLM-0053, CLM-0062]."
  - "claims.yaml complete: 63 claims and 1 hypothesis; every claim line of README, LIMITATIONS and NOTES tagged and every tag resolving; cpgate-k7 K7.5 PASS [CLM-0067]."
  - "Final P25 count 264 452 426 B of 275 000 000 B [CLM-0019]."
  - "make lint-workflow and every make ci-* target exit 0 on the clean build of 77c5f6c, no target skipped [CLM-0066]; every K7.1–K7.7 criterion PASS on the evidence in cpgate-k7 [CLM-0067]."
  - "Resume after the reboot into the installed kernel: kernel equals the installed package, veth loaded, bridge probe started [CLM-0059]; prereq-check 26/26, cpgate K1–K6 PASS on copies, images equal the lock [CLM-0060]."
