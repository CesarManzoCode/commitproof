  - "Resume order: the first `make prereq-check` after the reboot was 25/26 with D5 FAIL; the only occupant of the bridge subnet was this project's leftover network commitproof_cpnet (evidence/K4/prereq-resume-1.json). Read literally, the owner's step 1 says to stop BLOCKED; since the owner action would have been removing a project-labelled resource that step 2 already authorizes, the project-labelled containers, network and volumes were removed (images kept, nothing else touched, no sudo) and prereq-check re-run: 26/26 PASS (record prereq-check-resume, prereq-resume-2.json). `make prereq-check` writes evidence/K1/prereq.json; that K1 file was restored to its committed content both times."
  - "The evidence script could not resume an interrupted record (record-command.sh refuses to overwrite the logs of the unrecorded campaign-k4-d2p-1); fixed in dbab5e9, the resume is record campaign-k4-d2p-2."
  - "CI attempt ci-3 (dbab5e9) failed, exit 2: its nsmoke-f3a run was INVALID (leader unresolved) because the runner's new gRPC connections waited on the host's upstream DNS (gRPC service-config TXT lookups that Docker's embedded DNS forwards upstream; dockerd logged the timeouts). The same cause made one D2′ replay attempt INVALID (20261012T233152Z-D2p-3-M2-aeb8485c; counted nowhere, re-run valid). A harness defect, also against AGENTS.md §5 (no outbound network): fixed in e0795f1, rebuilt (build-4, images-build-4, images-verify-4), ci-4 exit 0. The D2′ runs were made before the fix and are valid; the SUT's own clients still send those lookups (LIM-35)."
  - "Two cells (C4 seed 2, C5 seeds 1–3) were re-run with fixed builds after harness defects (NOTES §9); the three C4 seed-2 INVALID attempts are archived in evidence/K4/harness-defect-runs/ (same plan as the re-run), the nine C5 attempts stay in runs/ (different plan). K4 runs come from three commitproof commits (f4a5a0f, ccda4a4, 6232f91)."
  - "elle-cli's three-pass cross-check could not finish on three of four real-build histories (OutOfMemoryError); the validity pass was recorded separately and cpgate K4.7 accepts it (NOTES §7, LIM-31)."
  - "Minimization candidates and replays of mutant and H1 failures are committed as stubs to stay within P25 (LIM-30); evidence/ is 183.1 MB of the 200 MB budget, about 17 MB left for K5–K7."
