blocked:
  condition: "K4.3 fails: mutant M2 (cohort-add-local-view) is detected in 0 of 5 directed runs of D2 (need ≥ 4). The cause is D2's design: it assumes a failover recruits only the recorded cohort, but multiorch recruits every pooler of the shard and elects the most advanced, so n4 — the only node holding the writes M2 let it acknowledge — is elected and nothing is lost. Changing D2 after seeing mutant results is a relaxation that needs the owner (CONTRACT §9.1, §18; prompt §2)."
  evidence:
    command: "cpgate K4 --evidence evidence/K4 --negative-controls"
    output_excerpt: "K4.3 FAIL: \"M2 via D2: 0/5 runs FAIL with lost-write, need 4\"; details \"M2 via D2: UNDETECTED 0/5 with lost-write; mutant [PASS PASS PASS PASS PASS]; real [PASS PASS PASS PASS PASS]\". Observations of every M2 run: a pooler reports n4 as leader of rule 2.0 with cohort {n1,n2,n3} 16.6–19.1 s after the leader kill (record k3obs). Upstream: go/services/multiorch/recovery/actions/appoint_leader.go (cohort = shard.Poolers), go/common/consensus/proposals.go buildProposalCore (leader chosen among all recruited at the most advanced position)."
  owner_action: "Decide on ADR-0027: approve D2′ (F2b on n4 together with the leader's F2a + F2b, so the failover cannot recruit n4) and K4.3's M2 runs are re-run on it, or reject it and record M2 as UNDETECTED (then K4.3 remains failed and the gate needs your approval to close K4)."
