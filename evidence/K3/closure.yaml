deviations_from_prompt:
  - "F5a starts n4's containers with `docker start` (created at run start with `docker compose --profile n4 create`), not `docker compose up -d`: the runner cannot run Compose without host paths in recorded argv (ADR-0023, contract 1.0.4)."
  - "The slowfs stage is `FROM commitproof/pgctld-upstream:real` with a layer-prefix check recorded in the lock, because BuildKit cannot resolve `FROM <local image ID>` (ADR-0022, contract 1.0.4)."
  - "K3.1's evidence includes one composite run (§8's F5a → F3a → F2a shape) and cpgate K3.1 checks its order (prompt objective: 'and composites'); the contract's K3.1 list names single faults only."
  - "Two predicates check more than §8 states, both deterministic consequences of the fault: F1d also requires follower→leader connects to time out (the SYN-ACK is dropped); F7's heal also requires that no netem qdisc remains. F2a's hold is 0 (the death of the postmaster is the fault; its self-restart is the heal window)."
  - "Sealed runs are committed as zstd tar archives (CONTRACT §13) and cpgate reads them natively, which adds github.com/klauspost/compress v1.20.1 to go.mod (not in the §14 table)."
  - "ci-nemesis-smoke's pass condition (not stated by the contract): every fault confirmed and healed and no run INVALID; cpcheck's verdict is printed verbatim and a FAIL/UNKNOWN is a FINDING line, not a harness failure."
  - "Hidden subcommands added beside §5.6's: `commitproof __probe status` (the recorded status probe) and `commitproof images sabotage-runner` (K3.2/K3.3 fixtures)."
  - "The K2 synthetic generator now records the contract version it was generated under (1.0.3) instead of the current one, so the contract bump does not regenerate the K2 corpus referenced by seal root (commit 357ddbc); K1 and K2 gates re-pass (record k3-precondition)."
  - "The evidence pass ran twice: attempt 1 stopped at an INVALID F2a run caused by a harness defect (leader resolution); after the fix (090a366) everything was re-run from scratch. Attempt 1's INVALID run is kept sealed in evidence/K3/attempt-1/ with its record; its other runs were discarded (NOTES §9)."
  - "Host recovery during development: two FUSE connections of our own dead pg containers (created by a go-fuse defect, NOTES §9.3) were aborted through /sys/fs/fuse/connections/<n>/abort from a project-labelled container with every capability dropped and the fusectl directory bind-mounted — a root-equivalent action through the Docker socket (no sudo), limited to those two connections; the desktop's own FUSE connection was not touched."
