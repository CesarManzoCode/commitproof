demonstrated:
  # No claims.yaml exists yet (K7 deliverable, §17); each line cites its record and artifact (details in evidence/K3/NOTES.md).
  - "Every fault of CONTRACT §8 (F1a, F1b, F1c, F1d, F2a–F2e, F3a, F3b, F4a, F5a, F5b, F6, F7) and the composite F5a → F3a → F2a(leader) was injected on the real baseline cluster (Multigres e3cbdbb), confirmed by predicates over raw probe outputs within P27/P28 (F5a/F5b 120 s, F6 60 s), healed and heal-confirmed: 3 applications each (F6 2, F5a/F5b 1) in 16 sealed runs, all complete (records k3-run-*; gate K3.1)."
  - "Each confirmation and heal event carries the raw outputs of its probes and commands; 756 entries in 46 confirmation events and their heal events match their commands.jsonl records and output files (gate K3.4)."
  - "With each injector sabotaged to a no-op (cp_sabotage_inject_<kind>, 16 kinds) and with the F1a and F3a heals sabotaged (cp_sabotage_heal_f1a/_f3a), every run ended not-applied / not-healed, INVALID, exit 2 from commitproof run and from cpcheck (records k3-sab-*, k3-sabcheck-*; gates K3.2, K3.3)."
  - "slowfs at delay 0 kept the baseline HEALTHY (26.4–30.2 s) and the smoke checkers PASS (record slowfs-smoke-check, seal root 2653ee7f…), so F4a is used, not the F4b fallback; its overhead per 4 KiB write+fsync was about 70–83 µs (record slowfs-overhead)."
  - "cpcheck returned PASS, all nine checkers valid, on all 16 faulted runs of the real build (records k3-check-*; gate K3.5); one run per kind, no statistical claim."
  - "make ci-unit ci-checkers ci-cluster-smoke ci-nemesis-smoke exits 0 locally, ci-nemesis-smoke including F4a (record ci; gate K3.6); the workflow with the new job passes actionlint (record lint-workflow)."
