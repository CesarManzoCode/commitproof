  - "G9 held: session settings and named prepared statements stayed effective on the same client connection through F2a, F2b and F6 in 3 of 3 C9 runs (NOTES §7)"
  - "G10 violated on the real build: after a single pooler kill, leader kill or switchover a LISTEN session receives no further notification for the rest of the run (3/3 C9 runs; minimized to one fault; REPRODUCED in seeds 1 and 2), with measured loss windows of 69–78 s (NOTES §7, §10)"
  - "G11 held (claim level DESIGN at most): in 5 of 5 C10 runs and 5 of 5 real D5 runs, no CDC gap, phantom, duplicate or order violation across failovers; the failover slot was failover-ready before the first fault in every C10 run (K5.3 on the staged copy) (NOTES §8)"
  - "G12 held without faults: 200 cp_storm connections did not starve cp_steady and caused no failover (C11 seeds 1, 3); with an F2a inside a storm, G12's literal rule FAILed (seed 2, the failover's refusals; NOTES §9)"
  - "M5 (standby-slots-cleared) detected 5/5 by D5 with C7 cdc-phantom, the real build passing 5/5; mutant builds isolated (K5.4 details; NOTES §5)"
  - "every K5 FAIL run (11) minimized per §12.2 and replayed 5×; four real-build failures triaged (§6.2 review, §11 classification) (NOTES §10)"
  - "all CI targets exit 0 locally on the clean 4a8eb3a (ci-2, K5.6)"
