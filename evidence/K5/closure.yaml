demonstrated:   # no claims.yaml yet (K7); each line names its artifact in evidence/K5/NOTES.md
  - "K5.1: C7–C9's K5 completions classify 157 synthetic histories exactly (≥ 3 plants for each of the ten required classes; clean W5–W8 and G8 histories valid), leave the 807 K2 classifications unchanged, and each of 12 sabotage rules fails exactly the labels written beforehand. All recorded before any live K5 run (NOTES §4)."
  - "G8 held: in each of C8's three judged buffered switchovers no autocommit statement failed and every failed explicit transaction got 40001 (NOTES §6, §12)."
  - "G9 held: session settings and named prepared statements stayed effective on the same client connection through F2a, F2b and F6 in 3 of 3 C9 runs (NOTES §7)."
  - "G10 violated on the real build: after a single pooler kill, leader kill or switchover, a LISTEN session receives no further notification for the rest of the run. 3/3 C9 runs; minimized to one fault; REPRODUCED in seeds 1 and 2; measured loss windows 69–78 s. Harness review: the W6 listener is not the cause (record g10-listener-check) (NOTES §7, §10)."
  - "G11 held (claim level DESIGN at most): no CDC gap, phantom, duplicate or order violation across failovers in 5 of 5 C10 runs and 5 of 5 real D5 runs. The failover slot was failover-ready before the first fault in every C10 run (K5.3, re-read from git) (NOTES §8)."
  - "G12 held without faults: 200 cp_storm connections did not starve cp_steady and caused no failover (C11 seeds 1, 3). With an F2a inside a storm, G12's literal rule FAILed (seed 2): all 120 refusals fall inside the F2a window, and 744 of 744 operations outside it were ok (record c11-window-check; NOTES §9)."
  - "M3 (gateway-retry-any) detected 4/5 by D3′ with C2 g1a, the real build passing 5/5, as the predictions committed before any D3′ run stated (eea9d37). The four minimized D3′ failures reproduced 5, 5, 4 and 5 of 5 (NOTES §5, §10)."
  - "M5 (standby-slots-cleared) detected 5/5 by D5 with C7 cdc-phantom, the real build passing 5/5. Mutant builds isolated (NOTES §5)."
  - "Every K5 FAIL run (15) minimized per §12.2 and replayed 5×; four real-build failures triaged (§6.2 review, §11 classification) (NOTES §10)."
  - "All CI targets exit 0 locally on the clean 9be7087 (ci-5, K5.6)."
