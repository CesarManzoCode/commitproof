# CommitProof CI (CONTRACT §13, ADR-0010). Workflows only call make targets,
# so the same targets run locally; remote runs happen only when the owner
# pushes (AGENTS.md §6). Actions are pinned by commit SHA.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false
      - name: make ci-unit
        run: make ci-unit

  ci-cluster-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false
      # PREREQUISITES §4 on the CI runner: modules the cluster-up preflight
      # requires (nemesis faults use them from K3).
      - name: Load kernel modules
        run: sudo modprobe -a nf_tables nft_compat sch_netem fuse
      - name: make ci-cluster-smoke
        run: make ci-cluster-smoke
